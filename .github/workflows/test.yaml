name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
      - name: Download Go modules
        run: go mod download
      - name: Regenerate package data
        run: go generate ./internal/pkgdata ./internal/server
      - name: Ensure package data is up to date
        run: git diff --exit-code
      - name: Test Go code
        run: go test -v -race -covermode atomic -coverprofile coverage.out ./...
      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          disable_search: true
          files: coverage.out
  test-no-pkgdata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
      - name: Download Go modules
        run: go mod download
      - name: Check isolated test dependencies
        run: |
          go list -deps -test -tags=test_no_pkgdata ./... > "$RUNNER_TEMP/isolated-test-dependencies.txt"
          if grep -E '^github\.com/goplus/spx(/|$)' "$RUNNER_TEMP/isolated-test-dependencies.txt"; then
            echo "Isolated tests must not import the spx SDK."
            exit 1
          fi
      - name: Test without embedded package data
        run: >-
          go test -v -race -shuffle=on -tags=test_no_pkgdata
          -overlay=testdata/no-pkgdata/overlay.json -bench=. -benchtime=1x ./...
  test-go-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
      - name: Download Go modules
        run: go mod download
      - name: Build Go binary
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -v -trimpath -ldflags "-s -w" -o bin/xgolsw.wasm
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
      - name: Download Go modules
        run: go mod download
      - name: Test WebAssembly entry points without embedded package data
        env:
          GOOS: js
          GOARCH: wasm
        run: >-
          PATH="$(go env GOROOT)/lib/wasm:$PATH"
          go test -v -shuffle=on -tags=test_no_pkgdata
          -overlay=testdata/no-pkgdata/overlay.json .
